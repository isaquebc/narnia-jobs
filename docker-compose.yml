# narnia-jobs · produção local. Suba com ./start.sh up (Linux/macOS) ou .\start.ps1 up (Windows): o lançador escolhe
# a porta do host (NARNIA_PORT em .env), constrói as imagens, espera a api ficar saudável e imprime a URL com o token.
# Serviços: web (nginx + SPA, única porta publicada), api (Hono + SDK), worker (BullMQ), redis. Dados em ./data (bind mount);
# login da assinatura no volume claude-auth (ou CLAUDE_CODE_OAUTH_TOKEN no .env). Ver plans/plan-v0/08 §1.2.

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  image: narnia-jobs/app
  restart: unless-stopped
  user: "${NARNIA_UID:-1000}:${NARNIA_GID:-1000}"   # uid de quem chama: ./data fica do usuário do host (padrão: node)
  volumes:
    - ${NARNIA_DATA_DIR:-./data}:/data
    - ${NARNIA_BACKUP_HOST_DIR:-./backups}:/backups   # backups fora da pasta de dados (F03-fix L1)
    - claude-auth:/home/node/.claude
    - gh-auth:/home/node/.config/gh   # F03-1: token do gh do computador (host-token) ou login próprio do app
  environment:
    - NARNIA_DATA_DIR=/data
    - NARNIA_BACKUP_DIR=/backups
    - REDIS_URL=redis://redis:6379
    - NARNIA_QUEUE_PREFIX=narnia
    - NARNIA_PROVIDER=${NARNIA_PROVIDER:-claude-code}
    - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    - CLAUDE_CONFIG_DIR=/home/node/.claude   # F07/M7: o .claude.json (MCP do Google) fica no volume claude-auth
    - TESSDATA_PATH=/usr/share/tessdata
    - NARNIA_OTEL_ENDPOINT=${NARNIA_OTEL_ENDPOINT:-}   # F04-15: vazio = sem rastros; com o perfil observability use http://phoenix:6006/v1/traces
    - NARNIA_OTEL_CONTENT=${NARNIA_OTEL_CONTENT:-1}   # 0 deixa só metadados nos rastros

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: web
    image: narnia-jobs/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NARNIA_PORT:-3100}:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    init: true   # tini como PID 1: recolhe processos claude mortos (plano de comunicação C3)
    command: ["/app/docker/entrypoint.sh"]
    environment:
      - NARNIA_DATA_DIR=/data
      - NARNIA_BACKUP_DIR=/backups
      - REDIS_URL=redis://redis:6379
      - NARNIA_QUEUE_PREFIX=narnia
      - NARNIA_PROVIDER=${NARNIA_PROVIDER:-claude-code}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - CLAUDE_CONFIG_DIR=/home/node/.claude   # F07/M7: o .claude.json (MCP do Google) fica no volume claude-auth
      - TESSDATA_PATH=/usr/share/tessdata
      - NARNIA_TOKEN=${NARNIA_TOKEN:-}
      - NARNIA_PUBLIC_URL=http://127.0.0.1:${NARNIA_PORT:-3100}
      - NARNIA_VERSION=${NARNIA_VERSION:-0.1.0-dev}
      - PORT=3100
      - NARNIA_OTEL_ENDPOINT=${NARNIA_OTEL_ENDPOINT:-}
      - NARNIA_OTEL_CONTENT=${NARNIA_OTEL_CONTENT:-1}   # 0 deixa só metadados nos rastros
      - NARNIA_BROWSER_WS=${NARNIA_BROWSER_WS-ws://browser:3000/narnia}   # vaga por URL que precisa de navegador (vazio desliga)
    networks: [default, browser]
    ports:
      - "127.0.0.1:${NARNIA_OAUTH_PORT-8089}:8089"      # callback OAuth do Google Calendar (F07); porta fixa
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    <<: *app
    init: true   # tini como PID 1: recolhe processos claude mortos (plano de comunicação C3)
    command: ["sh", "-c", "cd /app/apps/worker && exec ./node_modules/.bin/tsx src/main.ts"]
    environment:
      - NARNIA_DATA_DIR=/data
      - NARNIA_BACKUP_DIR=/backups
      - REDIS_URL=redis://redis:6379
      - NARNIA_QUEUE_PREFIX=narnia
      - NARNIA_PROVIDER=${NARNIA_PROVIDER:-claude-code}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - CLAUDE_CONFIG_DIR=/home/node/.claude   # F07/M7: o .claude.json (MCP do Google) fica no volume claude-auth
      - TESSDATA_PATH=/usr/share/tessdata
      - NARNIA_OTEL_ENDPOINT=${NARNIA_OTEL_ENDPOINT:-}
      - NARNIA_OTEL_CONTENT=${NARNIA_OTEL_CONTENT:-1}
      - NARNIA_BROWSER_WS=${NARNIA_BROWSER_WS-ws://browser:3000/narnia}   # F05: PDF do CV e da carta
    networks: [default, browser]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # Chromium headless da busca de vaga por URL (F06) e do PDF do CV (F05): só na rede `browser`, com o api e o worker;
  # sem volumes nem portas
  browser:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: browser
    image: narnia-jobs/browser
    restart: unless-stopped
    init: true
    networks: [browser]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # a imagem do Phoenix roda sem root (uid 65532) e é distroless: o volume novo nasce com dono root, então um passo de
  # preparo (imagem do redis, já presente) ajusta o dono antes do Phoenix subir
  phoenix-init:
    image: redis:7-alpine
    profiles: ["observability"]
    user: "0"
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /mnt/data"]
    volumes:
      - phoenix-data:/mnt/data

  # F04-15: Arize Phoenix local, desligado por padrão na produção (sobe com --profile observability)
  phoenix:
    image: arizephoenix/phoenix:version-20.21.0-nonroot
    depends_on:
      phoenix-init:
        condition: service_completed_successfully
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    ports:
      - "127.0.0.1:${NARNIA_PHOENIX_PORT:-6006}:6006"
    volumes:
      - phoenix-data:/mnt/data

networks:
  browser:   # api e worker ↔ navegador; o navegador não enxerga redis nem web

volumes:
  claude-auth:
  gh-auth:
  redis-data:
  phoenix-data:
