name: Ideia · Feature request
description: Sugira uma melhoria · Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Que problema resolve · What problem does it solve
      description: Conte a situação da sua busca de emprego em que isso ajudaria.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: O que você imagina · What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas · Alternatives
