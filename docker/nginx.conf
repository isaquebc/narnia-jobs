# narnia-jobs · web: SPA + proxy para a api. Publicado no host em 127.0.0.1:${NARNIA_PORT}:80.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 12m;          # uploads de até 10 MB (+ overhead do multipart)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # F07/M3: anexos das candidaturas até 100 MB (vídeo de entrevista); o resto da api continua com 12 MB
  location ~ ^/api/job-applications/[^/]+/entries$ {
    client_max_body_size 105m;
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location /api/ {
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
  }

  location /ws {
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /mcp {                    # servidor MCP via HTTP (F04)
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
