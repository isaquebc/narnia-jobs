packages:
  - "apps/*"
  - "packages/*"

# Scripts de instalação (pnpm >= 10 bloqueia por padrão): esbuild precisa do binário; msgpackr-extract é opcional (fallback JS)
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  # tesseract.js: postinstall só imprime aviso de uso; sem binário nativo
  tesseract.js: false
  # transformers.js (R6): o binário de CPU vem no pacote; o postinstall só baixa CUDA. protobufjs: só checa versão
  onnxruntime-node: false
  protobufjs: false

minimumReleaseAgeExclude:
  - docx@9.9.0
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.292"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.292"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.292"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.292"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.292"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.292"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.292"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.292"
  - "@anthropic-ai/claude-agent-sdk@0.3.292"
