# Desenvolvimento, lint, testes e build: tudo dentro de containers. O host só precisa de Docker.
# Instâncias: a do dono (padrão, ./data, :5173/:3100) e a do Claude (NARNIA_INSTANCE=claude, .env.claude: projeto
# narnia-claude, ./.claude-data/dev, :5174/:3200, provider mock). Mesmo código, nada compartilhado além do repositório.
# Dev funciona como a produção (provider claude-code, login no volume claude-auth, compartilhado com ./start.sh up,
# ou CLAUDE_CODE_OAUTH_TOKEN do .env); a diferença é o hot reload. Mock só quando pedido: NARNIA_PROVIDER=mock ./start.sh dev
# Uso via ./start.sh:  dev | test | lint | typecheck | build | shell | test:sh
#   ./start.sh dev  -> sobe web (Vite :5173), api (tsx watch :3100), worker e redis com hot reload
#   demais          -> docker compose -f docker-compose.dev.yml run --rm dev pnpm <cmd>
x-dev: &dev
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  user: node
  working_dir: /app
  volumes:
    # código: a raiz ou, na instância do dono com cópia separada, `.owner-src` (C7/CM-4); dados e backups sempre da raiz
    - ${NARNIA_SRC_DIR:-.}:/app
    - ${NARNIA_DATA_MOUNT:-./data}:/app/data
    - ${NARNIA_BACKUP_MOUNT:-./backups}:/app/backups
    - node_modules:/app/node_modules
    - pnpm-store:/pnpm/store
    - claude-auth:/home/node/.claude
    - gh-auth:/home/node/.config/gh   # F03-1: token do gh do computador (host-token) ou login próprio do app
  environment:
    - REDIS_URL=redis://redis:6379
    - NARNIA_DATA_DIR=${NARNIA_DEV_DATA_DIR:-/app/data}
    - NARNIA_BACKUP_DIR=${NARNIA_DEV_BACKUP_DIR:-/app/backups}
    - NARNIA_PROVIDER=${NARNIA_PROVIDER:-claude-code}
    - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

services:
  dev:
    <<: *dev
    depends_on: [redis]
    command: ["pnpm", "--version"]

  api:
    <<: *dev
    init: true   # tini como PID 1: recolhe processos claude mortos (plano de comunicação C3)
    profiles: ["app"]
    command: ["pnpm", "--filter", "@narnia-jobs/api", "exec", "tsx", "watch", "src/server.ts"]
    ports:
      - "127.0.0.1:${NARNIA_DEV_API_PORT:-3100}:3100"   # só em dev: a API fica acessível no host para curl/Vite
    environment:
      - REDIS_URL=redis://redis:6379
      - NARNIA_DATA_DIR=${NARNIA_DEV_DATA_DIR:-/app/data}
      - NARNIA_BACKUP_DIR=${NARNIA_DEV_BACKUP_DIR:-/app/backups}
      - NARNIA_PROVIDER=${NARNIA_PROVIDER:-claude-code}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - NARNIA_TOKEN=${NARNIA_TOKEN:-dev-token}         # token de boot previsível em dev; em produção é aleatório
      - NARNIA_PUBLIC_URL=http://127.0.0.1:${NARNIA_DEV_API_PORT:-3100}
      - PORT=3100
      - NARNIA_OTEL_ENDPOINT=${NARNIA_OTEL_ENDPOINT-http://phoenix:6006/v1/traces}   # F04-15: rastros no Phoenix local (vazio desliga)
      - NARNIA_OTEL_CONTENT=${NARNIA_OTEL_CONTENT:-1}   # 0 tira perguntas, respostas, prompts e resultados de tools dos rastros
      - NARNIA_BROWSER_WS=${NARNIA_BROWSER_WS-ws://browser:3000/narnia}   # vaga por URL que precisa de navegador (vazio desliga)
    networks: [default, browser]
    depends_on: [redis]

  worker:
    <<: *dev
    init: true   # tini como PID 1: recolhe processos claude mortos (plano de comunicação C3)
    profiles: ["app"]
    command: ["pnpm", "--filter", "@narnia-jobs/worker", "exec", "tsx", "watch", "src/main.ts"]
    environment:
      - REDIS_URL=redis://redis:6379
      - NARNIA_DATA_DIR=${NARNIA_DEV_DATA_DIR:-/app/data}
      - NARNIA_BACKUP_DIR=${NARNIA_DEV_BACKUP_DIR:-/app/backups}
      - NARNIA_PROVIDER=${NARNIA_PROVIDER:-claude-code}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - TESSDATA_PATH=/usr/share/tessdata
      - NARNIA_OTEL_ENDPOINT=${NARNIA_OTEL_ENDPOINT-http://phoenix:6006/v1/traces}   # F04-15: rastros no Phoenix local (vazio desliga)
      - NARNIA_OTEL_CONTENT=${NARNIA_OTEL_CONTENT:-1}   # 0 tira perguntas, respostas, prompts e resultados de tools dos rastros
      - NARNIA_BROWSER_WS=${NARNIA_BROWSER_WS-ws://browser:3000/narnia}   # F05: PDF do CV e da carta
    networks: [default, browser]
    depends_on: [redis]

  web:
    <<: *dev
    profiles: ["app"]
    command: ["pnpm", "--filter", "@narnia-jobs/web", "dev"]
    ports:
      - "127.0.0.1:${NARNIA_DEV_PORT:-5173}:5173"
    depends_on: [api]

  # Chromium headless da busca de vaga por URL (F06) e do PDF do CV (F05): só na rede `browser`, com o api e o worker
  browser:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: browser
    profiles: ["app"]
    init: true
    networks: [browser]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # a imagem do Phoenix roda sem root (uid 65532) e é distroless: o volume novo nasce com dono root, então um passo de
  # preparo (imagem do redis, já presente) ajusta o dono antes do Phoenix subir
  phoenix-init:
    image: redis:7-alpine
    user: "0"
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /mnt/data"]
    volumes:
      - phoenix-data:/mnt/data

  # F04-15: Arize Phoenix local (rastros e avaliações do chat), ligado por padrão no dev, só em 127.0.0.1; cada instância
  # tem as suas portas (dono 6006/4317; Claude no .env.claude) e os seus dados (volume do projeto)
  phoenix:
    image: arizephoenix/phoenix:version-20.21.0-nonroot
    depends_on:
      phoenix-init:
        condition: service_completed_successfully
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    ports:
      - "127.0.0.1:${NARNIA_PHOENIX_PORT:-6006}:6006"        # interface + OTLP/HTTP (/v1/traces)
      - "127.0.0.1:${NARNIA_PHOENIX_GRPC_PORT:-4317}:4317"   # OTLP/gRPC
    volumes:
      - phoenix-data:/mnt/data

networks:
  browser:   # api e worker ↔ navegador; o navegador não enxerga redis nem web

volumes:
  node_modules:
  pnpm-store:
  claude-auth:   # mesmo nome que no docker-compose.yml: o login vale para dev e produção
  phoenix-data:  # F04-15: dados do Phoenix da instância
  gh-auth:       # F03-1: por projeto Docker (cada instância tem o seu); o lançador grava o token do gh do host
